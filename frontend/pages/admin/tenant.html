<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenants Management | Hatyai Condominium</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="../../css/admin-css/style-tenant.css">
    <script src="../../js/auth-guard.js"></script>
    <script defer src="../../js/admin/ui/script-tenant.js"></script>
</head>
<body>

    <div class="admin-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="../../picture/logo_hatyai.png" alt="Logo" class="logo">
                <h3>ADMIN</h3>
            </div>
            
            <ul class="menu-links">
                <li><a href="dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a></li>
                <li><a href="room.html"><i class="fas fa-door-open"></i> Rooms</a></li>
                <li   class="active"><a href="tenant.html"><i class="fas fa-users"></i> Tenants</a></li>
                <li><a href="payment.html"><i class="fas fa-credit-card"></i> Payments</a></li>
                <li><a href="repair.html"><i class="fas fa-tools"></i> Repairs</a></li>
                <li><a href="announcement.html"><i class="fas fa-bullhorn"></i> Announcement</a></li>
            </ul>

            <div class="logout-section">
                <a href="../../index.html"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </aside>

        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <main class="main-content">
            <header class="top-bar">
                <div class="header-left">
                    <div class="menu-toggle" id="menu-toggle">
                        <i class="fas fa-bars"></i>
                    </div>
                    <div class="page-title">
                        <h1>Tenants Management</h1>
                        <p class="sub-text">Manage all your room residents here</p>
                    </div>
                </div>

                <div class="admin-profile">
                    <span class="admin-name">Admin Officer</span>
                    <div class="profile-pic"><i class="fas fa-user-shield"></i></div>
                </div>
            </header>

            <section class="content-box control-bar">
                <div class="search-group">
                    <div class="search-wrapper">
                        <i class="fas fa-search"></i>
                        <input type="text" id="search-input" placeholder="Search tenants...">
                    </div>
                    
                    <select id="filter-status" class="custom-select">
                        <option value="" disabled selected>Filter Status</option>
                        <option value="all">All Statuses</option>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>

                <button id="add-tenant-btn" class="btn-primary">
                    <i class="fas fa-plus"></i> Add New Tenant
                </button>
            </section>

            <section class="content-box table-card">
                <div class="table-responsive">
                    <table class="modern-table">
                        <thead>
                            <tr>
                                <th>No.</th>
                                <th>Name</th>
                                <th>Room</th>
                                <th>Phone</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="tenant-table-body">
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <h2 class="modal-title">Add New Tenant</h2>
            <form id="add-tenant-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Frist Name</label>
                        <input type="text" placeholder="Frist Name" id="first-name">
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" placeholder="Last Name" id="last-name">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" placeholder="example@mail.com" id="email">
                    </div>

                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" placeholder="08x-xxx-xxxx" id="phone-number">
                    </div>
                    <div class="form-group">
                        <label>Move-in Date</label>
                        <input type="date" id="start-date">
                    </div>
                    <div class="form-group">
                        <label>Move-out Date</label>
                        <input type="date" id="end-date">
                    </div>

                    <div class="form-group">
                        <label>Building</label>
                        <input type="text" placeholder="Building Name" id="building">
                    </div>
                    <div class="form-group">
                        <label>Floor</label>
                        <input type="text" placeholder="floor Number" id="floor">
                    </div>
                    <div class="form-group">
                        <label>Room No.</label>
                        <input type="text" placeholder="e.g. A-101" id="room-number">
                    </div>

                    <div class="form-group">
                        <label>Status</label>
                        <select class="status-select" id="tenant-status">
                            <option value="active">Rented</option>
                            <option value="inactive">Vacated</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Deposit (฿)</label>
                        <input type="text" placeholder="0.00" id="deposit-amount">
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel">Cancel</button>
                    <button type="button" id="save-tenant-btn" class="btn-primary">Save Tenant</button>
                </div>
            </form>
        </div>
    </div>

    
</body>
</html>
