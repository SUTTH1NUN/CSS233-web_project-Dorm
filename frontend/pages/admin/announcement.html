<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements Management</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="../../css/admin-css/style-announcement.css">
    <script defer src="../../js/admin/script-announcement.js"></script> </body>
</head>
<body>

    <header>
        <i class="fas fa-bars menu-icon"></i>
        <h1>Announcement</h1>
    </header>
    
    <section id="manage-bar">
        <div class="search-group">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="search-announcement" placeholder="Search Announcements....">
            </div>
            
            <select id="filter-status">
                <option value="" disabled selected>Select Status</option>
                <option value="all">All Statuses</option>
                <option value="active">Active</option>
                <option value="inactive">InActive</option>
            </select>
        </div>

        <button id="add-announcement-btn">Add Announcement</button>
    </section>

    <div class="divider"></div>

    <section id="announcement-list">
        <table>
            <thead>
                <tr>
                    <th>No.</th>
                    <th>Room</th>
                    <th>Status</th>
                    <th>Topic</th>
                    <th>Description</th>
                    <th>About</th>
                </tr>
            </thead>
            <tbody id="table-body">
              </tbody>
        </table>
    </section>

    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <h2 class="modal-title">Add Announcement</h2>
            
            <form id="add-announcement-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Topic :</label>
                        <input type="text" placeholder="Enter topic">
                    </div>
                    <div class="form-group">
                        <label>Description :</label>
                        <input type="email" placeholder="Enter description ">
                    </div>
                    <div class="form-group"></div>
                    <div class="form-group">
                    <label>Out Date :</label>
                    <input type="date" class="date-input">
                    </div>
                   
                </div>

                <div class="modal-actions">
                    <button type="button" id="save-announcement-btn">Add Announcement</button>
                </div>
            </form>
        </div>
    </div>
    
</body>
</html>
