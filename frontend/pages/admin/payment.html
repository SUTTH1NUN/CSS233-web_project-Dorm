<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments Management | Hatyai Condominium</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="../../css/admin-css/style-payment.css">
    
    <style>
        .input-readonly { background-color: #eee; color: #555; cursor: not-allowed; border: 1px solid #ccc; }
        .input-highlight { border: 2px solid #007bff; background-color: #f0f8ff; }
        .dashed-line { border: 0; border-top: 2px dashed #ddd; margin: 15px 0; }
        .section-title { font-size: 0.95rem; font-weight: 600; color: #555; margin-bottom: 8px; margin-top: 10px; }
        .grand-total-input { font-size: 1.5rem; font-weight: bold; color: #28a745; text-align: right; }
    </style>

    <script defer src="../../js/admin/ui/script-payment.js"></script> 
</head>
<body>

    <div class="admin-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="../../picture/logo_hatyai.png" alt="Logo" class="logo">
                <h3>ADMIN</h3>
            </div>
            <ul class="menu-links">
                <li><a href="dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a></li>
                <li><a href="tenant.html"><i class="fas fa-users"></i> Tenants</a></li>
                <li  class="active"><a href="payment.html"><i class="fas fa-credit-card"></i> Payments</a></li>
                <li><a href="repair.html"><i class="fas fa-tools"></i>Repairs</a></li>
                <li><a href="announcement.html"><i class="fas fa-bullhorn"></i> Announcement</a></li>
            </ul>
            <div class="logout-section">
                <a href="../../index.html"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </aside>

        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <main class="main-content">
            <header class="top-bar">
                <div class="header-left">
                    <div class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></div>
                    <div class="page-title">
                        <h1>Payments Management</h1>
                        <p class="sub-text">Monitor rental payments and invoices</p>
                    </div>
                </div>
                <div class="admin-profile">
                    <span class="admin-name">Admin Officer</span>
                    <div class="profile-pic"><i class="fas fa-user-shield"></i></div>
                </div>
            </header>

            <section class="content-box control-bar">
                <div class="filter-group">
                    <div class="search-wrapper">
                        <i class="fas fa-search"></i>
                        <input type="text" id="search-payment" placeholder="Search Room...">
                    </div>
                    <div class="date-wrapper">
                        <input type="date" class="date-input">
                    </div>
                    <select id="filter-status" class="custom-select">
                        <option value="" disabled selected>Status</option>
                        <option value="all">All</option>
                        <option value="paid">Paid</option>
                        <option value="unpaid">Unpaid</option>
                    </select>
                </div>

                <button id="add-payment-btn" class="btn-primary">
                    <i class="fas fa-plus"></i> Create Invoice
                </button>
            </section>

            <section class="content-box table-card">
                <div class="table-responsive">
                    <table class="modern-table">
                        <thead>
                            <tr>
                                <th>No.</th>
                                <th>Room</th>
                                <th>Invoice Date</th>
                                <th>Total Amount</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

   <div id="payment-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 class="modal-title">Create New Invoice</h2>
            <form id="add-payment-form">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>Room No. (Type to fetch)</label>
                        <input type="text" id="room_number" name="room_number" placeholder="e.g. 101" required>
                    </div>
                    <div class="form-group">
                        <label>Billing Date</label>
                        <input type="date" name="billing_date" required>
                    </div>
                    <div class="form-group">
                        <label>Due Date</label>
                        <input type="date" name="due_date" required>
                    </div>
                </div>

                <input type="hidden" id="room_fee_hidden" value="0">

                <hr class="dashed-line">

                <div class="section-title"><i class="fas fa-bolt"></i> Electricity (8 THB/Unit)</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Prev Meter (Auto)</label>
                        <input type="number" id="elec_last" placeholder="Wait..." readonly class="input-readonly">
                    </div>
                    <div class="form-group">
                        <label style="color:#007bff;">Usage Units</label>
                        <input type="number" id="elec_units" placeholder="Enter units" required class="input-highlight">
                    </div>
                    <div class="form-group">
                        <label>Curr Meter (Auto)</label>
                        <input type="number" id="elec_curr" readonly class="input-readonly">
                    </div>
                    <div class="form-group">
                        <label>Fee (฿)</label>
                        <input type="number" id="elec_fee" readonly class="input-readonly">
                    </div>
                </div>

                <div class="section-title"><i class="fas fa-tint"></i> Water (15 THB/Unit)</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Prev Meter (Auto)</label>
                        <input type="number" id="water_last" placeholder="Wait..." readonly class="input-readonly">
                    </div>
                    <div class="form-group">
                        <label style="color:#007bff;">Usage Units</label>
                        <input type="number" id="water_units" placeholder="Enter units" required class="input-highlight">
                    </div>
                    <div class="form-group">
                        <label>Curr Meter (Auto)</label>
                        <input type="number" id="water_curr" readonly class="input-readonly">
                    </div>
                    <div class="form-group">
                        <label>Fee (฿)</label>
                        <input type="number" id="water_fee" readonly class="input-readonly">
                    </div>
                </div>

                <hr class="dashed-line">

                <div class="form-grid bottom-row">
                    <div class="form-group">
                        <label>Payment Status</label>
                        <select name="payment_status" class="custom-select" style="width: 100%;">
                            <option value="unpaid">Unpaid</option>
                            <option value="paid">Paid</option>
                        </select>
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label class="total-label">TOTAL AMOUNT (฿)</label>
                        <input type="number" id="total_amount" name="total_amount" placeholder="0.00" readonly class="grand-total-input">
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="btn-cancel-modal">Cancel</button>
                    <button type="submit" class="btn-primary">Save Invoice</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
